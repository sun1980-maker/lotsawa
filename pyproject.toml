[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lotsawa"
version = "0.1.0"
description = "Open-source toolkit for Tibetan Buddhist text translation and study"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["tibetan", "buddhism", "translation", "nlp", "buddhist-texts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Religion",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
openai    = ["openai>=1.0"]
all       = ["anthropic>=0.25", "openai>=1.0"]
dev       = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage   = "https://github.com/yourusername/lotsawa"
Repository = "https://github.com/yourusername/lotsawa"
Issues     = "https://github.com/yourusername/lotsawa/issues"

[tool.hatch.build.targets.wheel]
packages = ["lotsawa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
